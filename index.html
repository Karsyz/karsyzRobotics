<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/karsyzLogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#312e81" />
    <!-- Title, description and Open Graph tags are injected per route at build time (vite.config.js) and managed at runtime by react-helmet (src/Components/Seo.jsx). -->
    <title>Karsyz Robotics</title>
  </head>
  <body>
    <!--
      Netlify Forms: static copy of the React contact form (src/Components/Contact.jsx)
      so Netlify's build-time form detection registers it. Keep the name and field
      names in sync with the React form. Never shown to visitors.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
